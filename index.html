<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aionas guides</title>
<style>
  :root { --bg: #f3ece1; --card: #fffdf8; --ink: #1d2430; --soft: #5f6672; --teal: #0f6f86; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17191d; --card: #22252b; --ink: #ece8df; --soft: #a8a297; --teal: #5cc3dc; } }
  :root[data-theme="dark"] { --bg: #17191d; --card: #22252b; --ink: #ece8df; --soft: #a8a297; --teal: #5cc3dc; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { color: var(--teal); font-size: 32px; margin: 0 0 18px; }
  a.card { display: block; background: var(--card); border-radius: 16px; padding: 18px 22px; color: inherit; text-decoration: none; box-shadow: 0 2px 10px rgba(60,40,20,.07); }
  a.card b { color: var(--teal); font-size: 20px; display: block; margin-bottom: 4px; }
  a.card span { color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Aionas guides</h1>
  <a class="card" href="install-or-update/"><b>Install or update Aionas on your computer</b><span>One command from your browser, about two minutes. Video and step-by-step screens.</span></a>
</main>
</body>
</html>
